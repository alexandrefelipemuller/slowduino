;-------------------------------------------------------------------------------
; Slowduino TunerStudio project
;
; This .ini is NOT a Speeduino project file, and the firmware does not
; identify itself as Speeduino anymore (own signature "slowduino 202402",
; chosen so it never gets picked up by real Speeduino tooling or vice versa).
; It matches the Slowduino firmware exactly (see /slowduino/*.cpp,*.h on
; branch experimental/mapa-fabrica-speeduino), which only implements a subset
; of the wire-compatible Speeduino byte protocol:
;
;   - 2 ignition channels / max 4 cylinders, wasted spark, no cam/phase sensor
;   - No sequential injection, no staged/boost/VVT/CAN/flex-fuel/WMI control
;   - Pages 1 (settings), 2 (VE table), 3 (ignition table), 4 (ignition
;     settings) and 6 (CLT/IAT/O2 sensor calibration) are real. Pages 0, 5,
;     7-15 are protocol stubs: the firmware always reads them as zero and
;     silently discards writes, kept only so the byte framing (page sizes)
;     stays compatible with tools expecting 15 pages.
;
; Firmware identifies itself as "slowduino 202402" over serial ('Q'/'S'/'I'),
; matching this project's [MegaTune] signature for TunerStudio auto-detect -
; but only Fuel/Ignition/Idle/Trigger/Realtime dialogs below actually do
; anything on real hardware.
;-------------------------------------------------------------------------------

[MegaTune]
   MTversion      = 2.25
   queryCommand   = "Q"
   signature      = "speeduino 202402(s)"
   versionInfo    = "S"

[TunerStudio]
   iniSpecVersion = 3.64

;-------------------------------------------------------------------------------

[Constants]

   endianness          = little
   nPages              = 15
   pageSize            = 128, 288, 288, 128, 288, 128, 240, 384, 192, 192, 288, 192, 128, 288, 256

   pageIdentifier      = "\$tsCanId\x01", "\$tsCanId\x02", "\$tsCanId\x03", "\$tsCanId\x04", "\$tsCanId\x05", "\$tsCanId\x06", "\$tsCanId\x07", "\$tsCanId\x08", "\$tsCanId\x09", "\$tsCanId\x0A", "\$tsCanId\x0B", "\$tsCanId\x0C", "\$tsCanId\x0D", "\$tsCanId\x0E", "\$tsCanId\x0F"
   pageReadCommand     = "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c", "p%2i%2o%2c"
   pageValueWrite      = "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v"
   pageChunkWrite      = "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v", "M%2i%2o%2c%v"
   crc32CheckCommand   = "d%2i", "d%2i", "d%2i", "d%2i", "d%2i", "d%2i", "d%2i", "d%2i", "d%2i", "d%2i", "d%2i", "d%2i", "d%2i", "d%2i", "d%2i"
   burnCommand         = "b%2i", "b%2i", "b%2i", "b%2i", "b%2i", "b%2i", "b%2i", "b%2i", "b%2i", "b%2i", "b%2i", "b%2i", "b%2i", "b%2i", "b%2i"

   blockingFactor      = 128
   ; Abrir a porta serial reseta o ATmega328p via DTR, e o bootloader padrão
   ; do Uno/Nano leva ~1.5-2.5s antes do setup() do firmware sequer começar
   ; a rodar (ele fica ocupado com o protocolo do próprio bootloader nesse
   ; meio tempo). 1000ms era curto demais: o TunerStudio perguntava 'Q'
   ; cedo demais, o byte se perdia, e ele entrava num loop de reconexão
   ; (cada reconexão reseta o Arduino de novo, reiniciando o problema).
   delayAfterPortOpen  = 3000
   blockReadTimeout    = 3000
   tsWriteBlocks       = on
   interWriteDelay     = 10
   pageActivationDelay = 10
   messageEnvelopeFormat = msEnvelope_1.0
   tableCrcCommand     = "k\$tsCanId%2i%2o%2c"

;-------------------------------------------------------------------------------
; Page 1 - ConfigPage1 (globals.h), 128 bytes. Byte offset == field declaration
; order in the packed struct. Scales cross-checked against fuel.cpp/sensors.cpp.
;-------------------------------------------------------------------------------
page = 1
   nCylinders        = scalar, U08,   0,        "",        1.0,   0.0,   1,     4,   0
   reqFuel           = scalar, U16,   1,        "us",      1.0,   0.0,   0,     30000, 0
   injOpen           = scalar, U16,   3,        "us",      1.0,   0.0,   0,     10000, 0
   tpsMin            = scalar, U08,   5,        "ADC",     1.0,   0.0,   0,     255, 0
   tpsMax            = scalar, U08,   6,        "ADC",     1.0,   0.0,   0,     255, 0
   tpsFilter         = scalar, U08,   7,        "",        1.0,   0.0,   0,     240, 0
   mapMin            = scalar, U08,   8,        "kPa",     1.0,   0.0,   0,     255, 0
   mapMax            = scalar, U08,   9,        "kPa",     1.0,   0.0,   0,     255, 0
   mapFilter         = scalar, U08,  10,        "",        1.0,   0.0,   0,     240, 0
   loadAlgorithm     = bits,   U08,  11, [0:7], "Speed-Density (MAP)", "Alpha-N (TPS)"
   wueBins           = array,  U08,  12, [6],   "C",       1.0,   0.0,   -40,   100, 0
   wueValues         = array,  U08,  18, [6],   "%",       1.0,   0.0,   100,   200, 0
   asePct            = scalar, U08,  24,        "%",       1.0,   0.0,   100,   200, 0
   aseCount          = scalar, U08,  25,        "cycles",  1.0,   0.0,   0,     255, 0
   aeMode            = bits,   U08,  26, [0:7], "TPS", "MAP"
   aeThresh          = scalar, U08,  27,        "%or kPa/s", 1.0, 0.0,   0,     255, 0
   aePct             = scalar, U08,  28,        "%",       1.0,   0.0,   0,     255, 0
   primePulse        = scalar, U08,  29,        "ms",      0.1,   0.0,   0,     25.5, 1
   crankRPM          = scalar, U08,  30,        "RPM",     10.0,  0.0,   0,     2550, 0
   oilPressureProtEnable    = bits,   U08,  31, [0:7], "Off", "On"
   oilPressureProtThreshold = scalar, U08,  32, "kPa",     4.0,   0.0,   0,     1000, 0
   oilPressureProtHysteresis= scalar, U08,  33, "kPa",     4.0,   0.0,   0,     1000, 0
   oilPressureProtDelay     = scalar, U08,  34, "ticks",   1.0,   0.0,   0,     255, 0
   page1Spare        = array,  U08,  35, [93], "", 1.0, 0.0, 0, 255, 0

;-------------------------------------------------------------------------------
; Page 2 - VE table (16x16), standard Speeduino byte format. Unchanged.
;-------------------------------------------------------------------------------
page = 2
   veTable    = array, U08,   0, [16x16], "%",   1.0,   0.0,   0.0,   255.0, 0
   rpmBins    = array, U08, 256, [16],    "RPM", 100.0, 0.0,   0.0,   25500.0, 0
   mapBins    = array, U08, 272, [16],    "kPa", 1.0,   0.0,   0.0,   255.0, 0

;-------------------------------------------------------------------------------
; Page 3 - Ignition (advance) table (16x16). Cell = advance+40, standard format.
;-------------------------------------------------------------------------------
page = 3
   advTable   = array, U08,   0, [16x16], "deg", 1.0,   -40.0, -40.0, 215.0, 0
   rpmBins2   = array, U08, 256, [16],    "RPM", 100.0, 0.0,   0.0,   25500.0, 0
   mapBins2   = array, U08, 272, [16],    "kPa", 1.0,   0.0,   0.0,   255.0, 0

;-------------------------------------------------------------------------------
; Page 4 - ConfigPage2 (globals.h), 128 bytes. Trigger, dwell, idle (IAC PID),
; idle-advance and engine-protect settings.
;-------------------------------------------------------------------------------
page = 4
   triggerPattern    = bits,   U08,   0, [0:7], "Missing Tooth", "Basic Distributor"
   triggerTeeth      = scalar, U08,   1,        "teeth",   1.0,   0.0,   1,     60,  0
   triggerMissing    = scalar, U08,   2,        "teeth",   1.0,   0.0,   0,     3,   0
   dwellRun          = scalar, U16,   3,        "us",      1.0,   0.0,   0,     25000, 0
   dwellCrank        = scalar, U16,   5,        "us",      1.0,   0.0,   0,     25000, 0
   dwellLimit        = scalar, U16,   7,        "us",      1.0,   0.0,   0,     25000, 0
   crankAdvance      = scalar, S08,   9,        "deg",     1.0,   0.0,   -40,   40,  0
   revLimitRPM       = scalar, U08,  10,        "RPM",     100.0, 0.0,   0,     25500, 0
   cltAdvBins        = array,  S08,  11, [4],   "C",       1.0,   0.0,   -40,   127, 0
   cltAdvValues      = array,  S08,  15, [4],   "deg",     1.0,   0.0,   -40,   40,  0
   ignInvert         = bits,   U08,  19, [0:7], "Normal", "Inverted"
   triggerEdge       = bits,   U08,  20, [0:7], "Rising", "Falling", "Both (CHANGE)"
   engineProtectEnable = bits, U08,  21, [0:7], "Off", "On"
   engineProtectRPM  = scalar, U08,  22,        "RPM",     100.0, 0.0,   0,     25500, 0
   engineProtectRPMHysteresis = scalar, U08, 23, "RPM",    100.0, 0.0,   0,     25500, 0
   iacAlgorithm      = bits,   U08,  24, [0:7], "None", "PWM Open Loop", "PWM Open+Closed Loop"
   idleFreq          = scalar, U08,  25,        "Hz*2",    2.0,   0.0,   0,     500, 0
   iacBins           = array,  S08,  26, [4],   "C",       1.0,   0.0,   -40,   127, 0
   iacOLPWMVal       = array,  U08,  30, [4],   "%",       1.0,   0.0,   0,     100, 0
   iacCLValues       = array,  U08,  34, [4],   "RPM*10",  10.0,  0.0,   0,     2550, 0
   iacCrankBins      = array,  S08,  38, [4],   "C",       1.0,   0.0,   -40,   127, 0
   iacCrankDuty      = array,  U08,  42, [4],   "%",       1.0,   0.0,   0,     100, 0
   idleKP            = scalar, U08,  46,        "1/16",    1.0,   0.0,   0,     255, 0
   idleKI            = scalar, U08,  47,        "1/16",    1.0,   0.0,   0,     255, 0
   idleKD            = scalar, U08,  48,        "1/16",    1.0,   0.0,   0,     255, 0
   iacCLminValue     = scalar, U08,  49,        "%",       1.0,   0.0,   0,     100, 0
   iacCLmaxValue     = scalar, U08,  50,        "%",       1.0,   0.0,   0,     100, 0
   idleTaperTime     = scalar, U08,  51,        "0.1s",    0.1,   0.0,   0,     25.5, 1
   iacTPSlimit       = scalar, U08,  52,        "%",       1.0,   0.0,   0,     100, 0
   idleAdvEnabled    = bits,   U08,  53, [0:7], "Off", "Added", "Switched"
   idleAdvTPS        = scalar, U08,  54,        "%",       1.0,   0.0,   0,     100, 0
   idleAdvRPM        = scalar, U08,  55,        "RPM*100", 100.0, 0.0,   0,     25500, 0
   idleAdvBins       = array,  U08,  56, [4],   "RPM*10",  10.0,  0.0,   0,     2550, 0
   idleAdvValues     = array,  S08,  60, [4],   "deg",     1.0,   0.0,   -40,   40,  0
   page4Spare        = array,  U08,  64, [64], "", 1.0, 0.0, 0, 255, 0

;-------------------------------------------------------------------------------
; Page 6 - CalibrationConfig (globals.h), 128 bytes. Curvas ADC->temperatura
; para CLT/IAT (CALIB_POINTS=8 pontos cada) e calibração linear min/max do
; sensor O2 (mesmo padrão de tpsMin/tpsMax na página 1).
;-------------------------------------------------------------------------------
page = 6
   cltAdcBins   = array, U16,  0, [8], "ADC",  1.0, 0.0,    0, 1023, 0
   cltTempBins  = array, S08, 16, [8], "C",    1.0, 0.0, -128,  127, 0
   iatAdcBins   = array, U16, 24, [8], "ADC",  1.0, 0.0,    0, 1023, 0
   iatTempBins  = array, S08, 40, [8], "C",    1.0, 0.0, -128,  127, 0
   o2Min        = scalar, U08, 48,      "ADC", 1.0, 0.0,    0,  255, 0
   o2Max        = scalar, U08, 49,      "ADC", 1.0, 0.0,    0,  255, 0
   page6Spare   = array, U08, 50, [78], "", 1.0, 0.0, 0, 255, 0

;-------------------------------------------------------------------------------
; Pages 5, 7-15: protocol stubs only (firmware reads back 0, discards writes).
; Kept as raw byte blobs purely so page sizes match the wire protocol; not
; exposed anywhere in the UI below.
;-------------------------------------------------------------------------------
page = 5
   page5Raw = array, U08, 0, [288], "", 1.0, 0.0, 0, 255, 0
page = 7
   page7Raw = array, U08, 0, [240], "", 1.0, 0.0, 0, 255, 0
page = 8
   page8Raw = array, U08, 0, [384], "", 1.0, 0.0, 0, 255, 0
page = 9
   page9Raw = array, U08, 0, [192], "", 1.0, 0.0, 0, 255, 0
page = 10
   page10Raw = array, U08, 0, [192], "", 1.0, 0.0, 0, 255, 0
page = 11
   page11Raw = array, U08, 0, [288], "", 1.0, 0.0, 0, 255, 0
page = 12
   page12Raw = array, U08, 0, [192], "", 1.0, 0.0, 0, 255, 0
page = 13
   page13Raw = array, U08, 0, [128], "", 1.0, 0.0, 0, 255, 0
page = 14
   page14Raw = array, U08, 0, [288], "", 1.0, 0.0, 0, 255, 0
page = 15
   page15Raw = array, U08, 0, [256], "", 1.0, 0.0, 0, 255, 0

;-------------------------------------------------------------------------------
[OutputChannels]
;  Matches buildRealtimePacket() in comms.cpp exactly. Everything not listed
;  below is always zero on the wire (memset'd), do not add gauges for it.
;-------------------------------------------------------------------------------
   ochBlockSize  = 126
   ochGetCommand = "A"

   secl        = scalar, U08,   0, "s",    1.0,    0.0
   status1     = scalar, U08,   1, "",     1.0,    0.0
   engine      = scalar, U08,   2, "",     1.0,    0.0
   syncLoss    = scalar, U08,   3, "",     1.0,    0.0
   MAP         = scalar, U16,   4, "kPa",  0.1,    0.0
   IAT         = scalar, U08,   6, "C",    1.0,   -40.0
   coolant     = scalar, U08,   7, "C",    1.0,   -40.0
   batCorrection = scalar, U08, 8, "%",    1.0,    0.0
   battery10   = scalar, U08,   9, "V",    0.1,    0.0
   O2          = scalar, U08,  10, "",     1.0,    0.0
   egoCorrection = scalar, U08, 11, "%",   1.0,    0.0
   iatCorrection = scalar, U08, 12, "%",   1.0,    0.0
   wueCorrection = scalar, U08, 13, "%",   1.0,    0.0
   rpm         = scalar, U16,  14, "RPM",  1.0,    0.0
   advance     = scalar, U08,  24, "deg",  1.0,   -40.0
   tps         = scalar, U08,  25, "%",    1.0,    0.0
   loopsPerSec = scalar, U16,  26, "",     1.0,    0.0
   freeRAM     = scalar, U16,  28, "bytes",1.0,    0.0
   spark       = scalar, U08,  32, "",     1.0,    0.0
   ethanolPct  = scalar, U08,  35, "%",    1.0,    0.0
   idleLoad    = scalar, U08,  38, "%",    1.0,    0.0
   baro        = scalar, U08,  41, "kPa",  1.0,    0.0
   pw1         = scalar, U16,  76, "us",   1.0,    0.0
   pw2         = scalar, U16,  78, "us",   1.0,    0.0
   pw3         = scalar, U16,  80, "us",   1.0,    0.0
   pw4         = scalar, U16,  82, "us",   1.0,    0.0
   CLIdleTarget= scalar, U08,  92, "RPM*10", 10.0, 0.0
   veCurr      = scalar, U08, 102, "%",    1.0,    0.0
   vss         = scalar, U16, 104, "km/h", 1.0,    0.0

;-------------------------------------------------------------------------------
[Datalog]
  ;       Channel        Label                Type    Format
  entry = time,          "Time",              float,  "%.3f"
  entry = secl,          "SecL",              int,    "%d"
  entry = rpm,           "RPM",               int,    "%d"
  entry = MAP,           "MAP",               float,  "%.1f"
  entry = tps,           "TPS",               float,  "%.1f"
  entry = coolant,       "CLT",               int,    "%d"
  entry = IAT,           "IAT",               int,    "%d"
  entry = advance,       "Advance",           float,  "%.1f"
  entry = pw1,           "PW1",               float,  "%.3f"
  entry = pw2,           "PW2",               float,  "%.3f"
  entry = battery10,     "Battery",           float,  "%.1f"
  entry = O2,            "O2",                float,  "%.2f"
  entry = idleLoad,      "Idle Duty",         int,    "%d"
  entry = CLIdleTarget,  "Idle Target",       int,    "%d"
  entry = veCurr,        "VE",                int,    "%d"

;-------------------------------------------------------------------------------
[GaugeConfigurations]
   gaugeCategory = "Main"
   ;Name           Var       Title       Units      Lo      Hi     LoD    LoW     HiW     HiD    vd  ld
   RPMGauge      = rpm,     "RPM",     "RPM",     0.0,   8000.0,  0.0,   500.0,   6000.0,  6500.0,  0, 0
   MAPGauge      = MAP,     "MAP",     "kPa",     0.0,   255.0,   0.0,   20.0,    200.0,   250.0,   0, 0
   TPSGauge      = tps,     "TPS",     "%",       0.0,   100.0,   0.0,   0.0,     100.0,   100.0,   1, 0
   CLTGauge      = coolant, "CLT",     "C",     -40.0,   150.0, -40.0,   0.0,     105.0,   120.0,   0, 0
   AdvanceGauge  = advance, "Advance", "deg",   -20.0,    60.0, -10.0,   0.0,     40.0,    50.0,    0, 0

[Tuning]

[FrontPage]
    gauge1=RPMGauge
    gauge2=MAPGauge
    gauge3=TPSGauge
    gauge4=CLTGauge
    gauge5=AdvanceGauge

;-------------------------------------------------------------------------------
[Menu]
;  Only pages 1, 2, 3, 4 and 6 map to real firmware behavior; that's all
;  that's exposed.
;-------------------------------------------------------------------------------

   menuDialog = main

   menu = "&Settings"
      subMenu = engineConstants_full,    "Engine / Fuel Settings"
      subMenu = triggerAndIgnition_full, "Trigger &amp; Ignition"
      subMenu = idleSettings_full,       "Idle (IAC) Settings"

   menu = "&Tuning"
      subMenu = veTableTbl,       "VE Table"
      subMenu = ignitionTableTbl, "Ignition Advance Table"

[UserDefined]
; Dialogs vivem aqui, não em "[Menu]" e não em um "[Dialog]" próprio (nenhum
; dos dois é reconhecido do jeito esperado - daí os dialogs referenciados no
; [Menu] acima nunca "existiam" de verdade pro parser: "hasn't been
; created"). No .ini real da Speeduino é literalmente [UserDefined] onde
; ficam todos os "dialog = ".

   dialog = engineConstants, "Engine / Fuel Settings"
      field = "Cylinders",       nCylinders
      field = "Required Fuel",   reqFuel
      field = "Injector open time", injOpen
      field = "TPS ADC min",     tpsMin
      field = "TPS ADC max",     tpsMax
      field = "TPS filter",      tpsFilter
      field = "MAP kPa @min ADC",mapMin
      field = "MAP kPa @max ADC",mapMax
      field = "MAP filter",      mapFilter
      field = "Load Algorithm",  loadAlgorithm
      field = "ASE %",           asePct
      field = "ASE cycles",      aseCount
      field = "AE mode",         aeMode
      field = "AE threshold",    aeThresh
      field = "AE %",            aePct
      field = "Prime pulse",     primePulse
      field = "Cranking RPM",    crankRPM

   dialog = sensorCalibration, "Sensor Calibration (CLT/IAT/O2)"
      curve = cltCalibCurve, "CLT Calibration"
      curve = iatCalibCurve, "IAT Calibration"
      field = "O2 ADC min",      o2Min
      field = "O2 ADC max",      o2Max

   dialog = oilProtect, "Oil Pressure Protection"
      field = "Enable",          oilPressureProtEnable
      field = "Threshold",       oilPressureProtThreshold
      field = "Hysteresis",      oilPressureProtHysteresis
      field = "Delay",           oilPressureProtDelay

   dialog = engineConstants_full, "Engine / Fuel Settings", xAxis
      topicHelp = ""
      panel = engineConstants, North
      panel = sensorCalibration, South
      panel = oilProtect, South

   dialog = triggerSettings, "Trigger"
      field = "Pattern",         triggerPattern
      field = "Teeth (total)",   triggerTeeth
      field = "Missing teeth",   triggerMissing
      field = "Trigger edge",    triggerEdge

   dialog = dwellSettings, "Dwell"
      field = "Dwell (running)", dwellRun
      field = "Dwell (cranking)",dwellCrank
      field = "Dwell limit",     dwellLimit
      field = "Cranking advance",crankAdvance
      field = "Rev limiter",     revLimitRPM
      field = "Ignition invert", ignInvert

   dialog = cltAdvance, "CLT Advance Correction"
      curve = cltAdvanceCurve, "Cold Advance"

   dialog = engineProtect, "Engine Protection"
      field = "Enable",          engineProtectEnable
      field = "RPM limit",       engineProtectRPM
      field = "Hysteresis",      engineProtectRPMHysteresis

   dialog = triggerAndIgnition_full, "Trigger &amp; Ignition", xAxis
      panel = triggerSettings, North
      panel = dwellSettings, South
      panel = cltAdvance, South
      panel = engineProtect, South

   dialog = iacSettings, "Idle Air Control"
      field = "Algorithm",       iacAlgorithm
      field = "PWM frequency",   idleFreq
      curve = iacOLCurve, "Open-loop duty vs CLT"
      curve = iacCLCurve, "Closed-loop RPM target vs CLT"
      curve = iacCrankCurve, "Crank duty vs CLT"
      field = "PID Kp",          idleKP
      field = "PID Ki",          idleKI
      field = "PID Kd",          idleKD
      field = "Closed-loop duty min", iacCLminValue
      field = "Closed-loop duty max", iacCLmaxValue
      field = "Taper time",      idleTaperTime
      field = "TPS limit (int. reset)", iacTPSlimit

   dialog = idleAdvance, "Idle Advance"
      field = "Mode",            idleAdvEnabled
      field = "Max TPS",         idleAdvTPS
      field = "Max RPM",         idleAdvRPM
      curve = idleAdvanceCurve, "Idle Advance"

   dialog = idleSettings_full, "Idle (IAC) Settings", xAxis
      panel = iacSettings, North
      panel = idleAdvance, South

;-------------------------------------------------------------------------------
[CurveEditor]
; Arrays não podem ir direto num "field =" de [Dialog] (o parser do
; TunerStudio derruba o dialog inteiro ao tentar). Curvas são a forma
; correta de expor um array constant editável.

   curve = cltCalibCurve, "CLT Calibration"
      columnLabel = "ADC", "Temperature"
      xAxis = 0, 1023, 8
      yAxis = -40, 150, 8
      xBins = cltAdcBins
      yBins = cltTempBins

   curve = iatCalibCurve, "IAT Calibration"
      columnLabel = "ADC", "Temperature"
      xAxis = 0, 1023, 8
      yAxis = -40, 150, 8
      xBins = iatAdcBins
      yBins = iatTempBins

   curve = cltAdvanceCurve, "Cold Advance"
      columnLabel = "Coolant Temp", "Advance"
      xAxis = -40, 127, 4
      yAxis = -40, 40, 4
      xBins = cltAdvBins, coolant
      yBins = cltAdvValues

   curve = iacOLCurve, "IAC Open-loop Duty"
      columnLabel = "Coolant Temp", "Duty"
      xAxis = -40, 127, 4
      yAxis = 0, 100, 4
      xBins = iacBins, coolant
      yBins = iacOLPWMVal

   curve = iacCLCurve, "IAC Closed-loop RPM Target"
      columnLabel = "Coolant Temp", "RPM Target"
      xAxis = -40, 127, 4
      yAxis = 0, 2550, 4
      xBins = iacBins, coolant
      yBins = iacCLValues

   curve = iacCrankCurve, "IAC Crank Duty"
      columnLabel = "Coolant Temp", "Duty"
      xAxis = -40, 127, 4
      yAxis = 0, 100, 4
      xBins = iacCrankBins, coolant
      yBins = iacCrankDuty

   curve = idleAdvanceCurve, "Idle Advance"
      columnLabel = "RPM Delta", "Advance"
      xAxis = 0, 2550, 4
      yAxis = -40, 40, 4
      xBins = idleAdvBins, rpm
      yBins = idleAdvValues

;-------------------------------------------------------------------------------
; NOTE: yBins/mapBins keep the "MAP"/"kPa" label regardless of loadAlgorithm.
; TunerStudio can't switch a table's axis label based on a firmware config
; value, so in Alpha-N mode this axis actually holds TPS% bins (0-100)
; even though it is still named/labeled as MAP/kPa here. Purely cosmetic;
; the firmware (fuel.cpp/ignition.cpp) reads the correct channel either way.
[TableEditor]
   table = veTableTbl, veTable, "VE Table", 2
      topicHelp = ""
      xBins = rpmBins, rpm
      yBins = mapBins, MAP
      zBins = veTable

   table = ignitionTableTbl, advTable, "Ignition Advance Table", 3
      topicHelp = ""
      xBins = rpmBins2, rpm
      yBins = mapBins2, MAP
      zBins = advTable
