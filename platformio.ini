; PlatformIO config para builds locais de teste (Uno/Nano e Mega2560).
; Não faz parte do fluxo oficial do projeto (que usa Arduino IDE), só serve
; para gerar .hex reproduzíveis pra simulação (PICSimLab) e diagnóstico.
[platformio]
src_dir = slowduino

[env]
framework = arduino
build_flags = -Wall

[env:uno]
platform = atmelavr
board = uno

; Build de diagnóstico: habilita o log serial (DEBUG_ENABLED) para
; investigar o bug de ignição no banco de testes. Não afeta o env:uno normal.
[env:uno_debug]
platform = atmelavr
board = uno
build_flags = -Wall -DDEBUG_ENABLED

[env:mega2560]
platform = atmelavr
board = megaatmega2560
build_flags = -DBOARD_SPEEDUINO_V04
