; PlatformIO Project Configuration File - branch ms1
;
; BRANCH ms1: adicionado só para poder aplicar -DSERIAL_TX_BUFFER_SIZE e
; -DSERIAL_RX_BUFFER_SIZE (reduz o objeto Serial do core Arduino). Isso NÃO
; é possível a partir de dentro do .ino no fluxo normal da Arduino IDE, que
; injeta "#include <Arduino.h>" como a primeira linha do sketch antes de
; qualquer código do projeto. O PlatformIO recompila o core por projeto,
; então os build_flags abaixo chegam a tempo.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno
src_dir = slowduino

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags =
    -DSERIAL_TX_BUFFER_SIZE=8
    -DSERIAL_RX_BUFFER_SIZE=8

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
board_build.mcu = atmega328p
build_flags =
    -DSERIAL_TX_BUFFER_SIZE=8
    -DSERIAL_RX_BUFFER_SIZE=8

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags =
    -DBOARD_SPEEDUINO_V04
    ; ATmega2560 tem 8KB de RAM - não precisa do corte agressivo de buffer
    ; do Serial que os ambientes atmega328p usam.
