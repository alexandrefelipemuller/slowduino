; PlatformIO config para builds locais de teste (Uno/Nano e Mega2560).
; Não faz parte do fluxo oficial do projeto (que usa Arduino IDE), só serve
; para gerar .hex reproduzíveis pra simulação (PICSimLab) e diagnóstico.
[platformio]
src_dir = slowduino

[env]
framework = arduino
build_flags = -Wall

[env:uno]
platform = atmelavr
board = uno

[env:mega2560]
platform = atmelavr
board = megaatmega2560
build_flags = -DBOARD_SPEEDUINO_V04
