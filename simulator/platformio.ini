; PlatformIO config para build local do gerador de roda fônica (simulador).
; Não faz parte do fluxo oficial do projeto, só serve para gerar .hex
; reproduzível para o segundo Arduino do banco de testes (PICSimLab/hardware).
[platformio]
src_dir = .

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = -Wall
